[package]
name = "luma"
version = "0.1.0"
description = "An IDE for everything Luau/Lua!"
authors = ["moonlight"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luma_lib"
path = "src/rust/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Luma"
path = "src/rust/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["png", "jpeg"] }
raw-window-handle = "0.6"
winit = "0.30"
softbuffer = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
