<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Luma</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* Stretch exactly like the old softbuffer renderer did. */
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <img src="/splash.png" alt="Luma splash" draggable="false" />
  </body>
</html>
