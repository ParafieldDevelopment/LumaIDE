[package]
name = "luma-tauri"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "luma-tauri"
path = "src/rust/main.rs"

[dependencies]
tauri = { version = "2", features = ["dynamic-acl"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-log = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-prevent-default = "0.2" # damn it tauri
luma-core = { path = "../luma-core" }
luma-diagnostics = { path = "../luma-diagnostics" }
anyhow = "1.0.104"
tauri-plugin-decorum = "1.1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
