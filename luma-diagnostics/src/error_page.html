<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #9198a1;
    --accent: #f0883e;
    --danger: #f85149;
    --code: #e3b341;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }

  .badge {
    margin-left: auto;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #ffdcd7;
    background: rgba(var(--danger-rgb, 248, 81, 73), .15);
    background: rgba(248, 81, 73, .15);
    border: 1px solid rgba(248, 81, 73, .4);
    border-radius: 999px;
    white-space: nowrap;
  }

  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 18px;
    min-height: 0;
  }

  .summary {
    margin: 0;
    color: var(--text);
    font-weight: 600;
  }

  .section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-dim);
  }

  pre {
    flex: 1 1 auto;
    min-height: 0;
    margin: 0;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--code);
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
  }

  code {
    font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    user-select: text;
    -webkit-user-select: text;
  }

  .note {
    margin: 0;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px 14px;
  }

  .meta {
    font-size: 12px;
    color: var(--text-dim);
  }

  button {
    margin-left: auto;
    padding: 6px 14px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover { border-color: var(--text-dim); }
  button:active { transform: translateY(1px); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 6px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
  <header>
    <h1>@@SUMMARY@@</h1>
    <span class="badge">@@KIND@@</span>
  </header>

  <main>
    <p class="section-label">Error &amp; traceback log</p>
    <pre id="details" spellcheck="false">@@DETAILS@@</pre>
    <p class="note">@@REPORTED_LINE@@</p>
  </main>

  <footer>
    <span class="meta">@@FOOTER_META@@</span>
    <button id="copy" type="button">Copy details</button>
  </footer>

<script>
  (function () {
    var button = document.getElementById("copy");
    var label;
    function restore() {
      button.textContent = label;
      setTimeout(function () { button.textContent = "Copy details"; }, 1600);
    }
    button.addEventListener("click", function () {
      label = button.textContent;
      var text = document.getElementById("details").textContent;
      function fallback() {
        var area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(area);
        button.textContent = "Copied ✓";
        restore();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          button.textContent = "Copied ✓";
          restore();
        }, fallback);
      } else {
        fallback();
      }
    });

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
  })();
</script>
</body>
</html>
